const clone=o=>JSON.parse(JSON.stringify(o));
let users=JSON.parse(localStorage.getItem('ispusula_users')||'null');
if(!Array.isArray(users)||!users.length){users=[{id:'admin',name:'Yönetici',email:'demo@ispusula.app',password:'123456',role:'admin',workspaceId:'main'}];localStorage.setItem('ispusula_users',JSON.stringify(users));}
let workspaces=JSON.parse(localStorage.getItem('ispusula_workspaces')||'null');
if(!Array.isArray(workspaces)||!workspaces.length){workspaces=[{id:'main',name:'İşPusula Ana İş Yeri'}];localStorage.setItem('ispusula_workspaces',JSON.stringify(workspaces));}
let currentUser=null;let activeWorkspaceId=localStorage.getItem('ispusula_active_workspace')||'main';
let data;
try{data=JSON.parse(localStorage.getItem('ispusula_ws_'+activeWorkspaceId))||JSON.parse(localStorage.getItem('ispusula_data'))||clone(seed)}catch(e){data=clone(seed)}
if(!Array.isArray(data.contracts))data.contracts=[];
for(const k of ['tasks','notes','partners','stopsales','inbox'])if(!Array.isArray(data[k]))data[k]=[];
const known=new Set(data.contracts.map(c=>String(c.hotel||'').trim().toLocaleLowerCase('tr-TR')));let nid=Math.max(0,...data.contracts.map(c=>Number(c.id)||0))+1;
seed.contracts.forEach(c=>{let k=c.hotel.trim().toLocaleLowerCase('tr-TR');if(!known.has(k)){data.contracts.push({...c,id:nid++});known.add(k)}});
let page='dashboard';
const save=()=>{localStorage.setItem('ispusula_ws_'+activeWorkspaceId,JSON.stringify(data));localStorage.setItem('ispusula_data',JSON.stringify(data));localStorage.setItem('ispusula_active_workspace',activeWorkspaceId)};
function persistUsers(){localStorage.setItem('ispusula_users',JSON.stringify(users))}
function persistWorkspaces(){localStorage.setItem('ispusula_workspaces',JSON.stringify(workspaces))}
function activeWorkspace(){return workspaces.find(w=>w.id===activeWorkspaceId)||workspaces[0]}
function switchWorkspace(id){if(!workspaces.some(w=>w.id===id))return;save();activeWorkspaceId=id;localStorage.setItem('ispusula_active_workspace',id);data=JSON.parse(localStorage.getItem('ispusula_ws_'+id)||'null')||clone(seed);save();render();toast('İş yeri değiştirildi')}
function newWorkspace(){let name=prompt('Yeni iş yerinin adı:');if(!name||!name.trim())return;let id='ws_'+Date.now();workspaces.push({id,name:name.trim()});persistWorkspaces();localStorage.setItem('ispusula_ws_'+id,JSON.stringify(clone(seed)));switchWorkspace(id)}
function addUser(){if(!currentUser||currentUser.role!=='admin'){toast('Yalnızca yönetici kullanıcı ekleyebilir');return}let name=prompt('Kullanıcının adı:');if(!name)return;let email=prompt('Kullanıcının e-posta adresi:');if(!email||!email.includes('@')){alert('Geçerli bir e-posta gir.');return}if(users.some(u=>u.email.toLowerCase()===email.toLowerCase())){alert('Bu e-posta zaten kayıtlı.');return}let password=prompt('Geçici şifre belirle (en az 8 karakter önerilir):');if(!password||password.length<6){alert('En az 6 karakterli bir şifre gir.');return}users.push({id:'u_'+Date.now(),name,email,password,role:'user',workspaceId:activeWorkspaceId});persistUsers();render();toast('Kullanıcı bu cihaz için eklendi')}
function deleteUser(id){if(!currentUser||currentUser.role!=='admin')return;let u=users.find(x=>x.id===id);if(!u||u.id===currentUser.id)return;if(!confirm(u.email+' kullanıcısı silinsin mi?'))return;users=users.filter(x=>x.id!==id);persistUsers();render();toast('Kullanıcı silindi')}
function wipeWorkspace(){if(!currentUser||currentUser.role!=='admin'){toast('Bu işlem yönetici yetkisi ister');return}let name=activeWorkspace().name;if(!confirm('DİKKAT: '+name+' içindeki tüm kontrat, iş, not, firma, stop-sale ve dosya kayıtları silinecek. Bu işlem geri alınamaz. Önce yedek aldın mı?'))return;if(!confirm('Son onay: Bu iş yerindeki TÜM kayıtları kalıcı olarak temizlemek istiyor musun?'))return;data=emptyData();save();render();toast('İş yeri verileri temizlendi')}
function changePassword(){if(!currentUser)return;let p=prompt('Yeni şifren (en az 6 karakter):');if(!p||p.length<6){alert('Şifre en az 6 karakter olmalı.');return}currentUser.password=p;users=users.map(u=>u.id===currentUser.id?currentUser:u);persistUsers();toast('Bu cihazdaki şifre güncellendi')}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0});
const dateTR=s=>s?new Date(s+'T12:00:00').toLocaleDateString('tr-TR'):'—';
const days=s=>Math.ceil((new Date((s||'')+'T23:59:59')-new Date())/86400000);
function toast(s){$('#toastRoot').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600)}
function initNav(){for(const id of ['sideNav','bottomNav'])$('#'+id).innerHTML=navItems.filter((x)=>id==='bottomNav'?['dashboard','contracts','incoming','tasks','notes'].includes(x[0]):true).map(([p,i,n])=>`<button data-page="${p}" class="${p===page?'active':''}"><span class="ico">${i}</span>${n}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page))}
function setPage(p){page=p;initNav();render()}
function heading(t,d,button=''){return `<div class="heading"><div><h1>${t}</h1><p>${d}</p></div>${button}</div>`}
function stat(l,v,f){return `<div class="stat"><span class="label">${l}</span><strong>${v}</strong><small>${f}</small></div>`}
function dashboard(){let pending=data.tasks.filter(x=>x.status!=='Tamamlandı');let notin=data.contracts.filter(x=>x.received!=='Geldi');let soon=data.contracts.filter(x=>days(x.discount)>=0&&days(x.discount)<=14);
return heading('Genel Bakış','Bugün takip etmen gerekenler',`<button class="primary" onclick="openModal('task')">＋ İş ekle</button>`)+`<div class="stats">${stat('Toplam kontrat',data.contracts.length,'Kayıtlı otel kontratı')}${stat('Bekleyen işler',pending.length,'Tamamlanması gereken')}${stat('Gelmemiş kontrat',notin.length,'Geldi durumuna alınmamış')}${stat('Yaklaşan bitiş',soon.length,'14 gün içinde')}</div><div class="grid2"><section class="panel"><h2>Kontratların geliş durumu</h2>${data.contracts.length?data.contracts.map(c=>`<div class="barrow"><span>${esc(c.hotel)}</span><div class="bar"><span style="width:${c.received==='Geldi'?100:c.received==='Bekleniyor'?55:15}%"></span></div><span class="pill ${c.received==='Geldi'?'':c.received==='Bekleniyor'?'warn':'bad'}">${esc(c.received)}</span></div>`).join(''):'<div class="empty">Kontrat eklenmedi.</div>'}</section><section class="panel"><h2>Bekleyen işler</h2>${pending.length?pending.slice(0,5).map(t=>`<div class="notice"><strong>${esc(t.title)}</strong><small>${esc(t.supplier||'Tedarikçi belirtilmedi')} · Son tarih: ${dateTR(t.due)}</small><div style="margin-top:7px"><button class="action" onclick="editItem('tasks',${t.id})">Aç / düzenle</button><button class="action" onclick="completeTask(${t.id})">Tamamlandı</button></div></div>`).join(''):'<div class="empty">Bekleyen iş yok.</div>'}</section></div><section class="panel" style="margin-top:13px"><h2>Hızlı işlemler</h2><div class="toolbar"><button class="secondary" onclick="openModal('contract')">＋ Kontrat ekle</button><button class="secondary" onclick="openModal('note')">＋ Not yaz</button><button class="secondary" onclick="document.getElementById('importFile').click()">⇧ Kontrat listesi aktar</button><input id="importFile" type="file" accept=".csv,.json,.txt" class="hidden" onchange="importFile(this)"><button class="secondary" onclick="setPage('partners')">Operatör web sayfaları</button></div><p class="muted" style="font-size:12px">Kontrat listelerini CSV veya JSON dosyasından aktarabilirsin. İlk satırda otel, oda, operatör, tedarikçi, fiyat, indirim bitişi, geliş durumu ve web sitesi gibi sütun adları bulunabilir.</p></section>`}

function openModal(type,item=null){let s=schemas[type];$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><form class="modal" onsubmit="submitItem(event,'${type}',${item?item.id:'null'})"><div class="modalhead"><h2>${item?'Kaydı düzenle':s.title+' ekle'}</h2><button type="button" class="iconbtn" onclick="closeModal()">✕</button></div><div class="formgrid">${s.fields.map(f=>{let v=item?(item[f[0]]??''):'';return `<div class="field" style="${f[2]==='textarea'?'grid-column:1/-1':''}"><label>${f[1].toUpperCase()}</label>${f[2]==='select'?`<select name="${f[0]}" ${f[3]?'required':''}>${f[4].map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select>`:f[2]==='textarea'?`<textarea name="${f[0]}" ${f[3]?'required':''}>${esc(v)}</textarea>`:`<input name="${f[0]}" type="${f[2]}" value="${esc(v)}" ${f[3]?'required':''} ${f[0]==='price'?'min="0" step="1"':''}>`}</div>`}).join('')}</div><div class="modalactions"><button type="button" class="secondary" onclick="closeModal()">Vazgeç</button><button class="primary">Kaydet</button></div></form></div>`}
function closeModal(){$('#modalRoot').innerHTML=''}
function submitItem(e,type,id){e.preventDefault();const s=schemas[type],fd=new FormData(e.target),o={};s.fields.forEach(f=>o[f[0]]=fd.get(f[0])||'');if(type==='contract')o.price=Number(o.price||0);if(type==='note'&&!o.date)o.date=new Date().toISOString().slice(0,10);const a=data[s.arr];if(id!==null){const i=a.findIndex(x=>x.id===Number(id));if(i>=0)a[i]={...a[i],...o}}else{o.id=Date.now();a.unshift(o)}save();closeModal();render();toast(id!==null?'Kayıt güncellendi':'Kayıt eklendi')}
function editItem(type,id){openModal(type,data[schemas[type].arr].find(x=>x.id===id))}
function deleteItem(type,id){if(!confirm('Bu kaydı silmek istiyor musun?'))return;data[schemas[type].arr]=data[schemas[type].arr].filter(x=>x.id!==id);save();render();toast('Kayıt silindi')}
function completeTask(id){let t=data.tasks.find(x=>x.id===id);if(t){t.status='Tamamlandı';save();render();toast('İş tamamlandı olarak işaretlendi')}}
function filterRows(){let q=$('#search').value.toLocaleLowerCase('tr-TR');document.querySelectorAll('#tbody tr[data-search]').forEach(r=>r.style.display=r.dataset.search.includes(q)?'':'none')}
function importFile(input){const file=input.files&&input.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{let parsed;const txt=String(reader.result);if(file.name.toLowerCase().endsWith('.json')){parsed=JSON.parse(txt);if(!Array.isArray(parsed))parsed=parsed.contracts||parsed.kontratlar||[]}else{const lines=txt.split(/\r?\n/).filter(x=>x.trim());const delim=(lines[0].match(/;/g)||[]).length>(lines[0].match(/,/g)||[]).length?';':',';const cells=line=>{let out=[],cur='',q=false;for(let i=0;i<line.length;i++){let ch=line[i];if(ch==='"'&&line[i+1]==='"'&&q){cur+='"';i++}else if(ch==='"')q=!q;else if(ch===delim&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out};const heads=cells(lines.shift()).map(h=>h.toLocaleLowerCase('tr-TR').replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').replace(/[^a-z0-9]/g,''));const map={otel:'hotel',oteladi:'hotel',hotel:'hotel',hotelname:'hotel',oda:'room',odatipi:'room',room:'room',operator:'operator',operatoradi:'operator',operatör:'operator',tedarikci:'supplier',supplier:'supplier',fiyat:'price',price:'price',indirimbitis:'discount',discount:'discount',durum:'status',status:'status',kontratdurumu:'received',gelisdurumu:'received',received:'received',website:'website',websitesi:'website',websayfasi:'website',not:'note',aciklama:'note'};parsed=lines.map(line=>{let vals=cells(line),o={};heads.forEach((h,i)=>{let key=map[h];if(key)o[key]=vals[i]||''});return o})}
let count=0;parsed.forEach(o=>{if(!o||!(o.hotel||o.hoteladi||o.otel))return;const norm={hotel:o.hotel||o.hoteladi||o.otel,room:o.room||o.odatipi||'',operator:o.operator||'',supplier:o.supplier||o.tedarikci||'',price:Number(String(o.price||o.fiyat||0).replace(/\./g,'').replace(',','.'))||0,discount:o.discount||o.indirimbitis||'',status:o.status||'Kontrol',received:o.received||o.kontratdurumu||o.gelisdurumu||'Bekleniyor',website:o.website||o.websitesi||'',note:o.note||o.not||o.aciklama||'',id:Date.now()+count};data.contracts.unshift(norm);count++});if(!count)throw new Error('Aktarılabilir otel satırı bulunamadı.');save();render();toast(count+' kontrat içe aktarıldı.')}catch(err){alert('Dosya aktarılamadı: '+err.message+'\nCSV için ilk satırda sütun başlıkları bulunmalı.')}input.value=''};reader.readAsText(file,'UTF-8')}

function addInboxFiles(input){
 const files=Array.from(input.files||[]);if(!files.length)return;
 const today=new Date().toISOString().slice(0,10);
 files.forEach((file,i)=>{
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  const type=ext==='pdf'?'PDF':(['xlsx','xls'].includes(ext)?'Excel':ext.toUpperCase());
  data.inbox.unshift({id:Date.now()+i,filename:file.name,filetype:type,hotel:'',supplier:'',receivedDate:today,status:'İncelenecek',note:'E-posta eki olarak alındı'});
 });
 save();render();toast(files.length+' dosya takip listesine eklendi');
 alert('Dosya adları ve takip kayıtları eklendi. Bu demo sürümünde dosya içeriği sunucuya yüklenmez; PDF/Excel içeriğini otomatik okumak için güvenli dosya işleme servisi gerekir.');
 input.value='';
}

function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ispusula-'+(activeWorkspace().name||'yedek').replace(/[^a-z0-9_-]/gi,'_')+'-yedek.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Yedek dosyası hazırlanıyor')}
function enterApp(user){currentUser=user;activeWorkspaceId=user.workspaceId||activeWorkspaceId;if(!workspaces.some(w=>w.id===activeWorkspaceId))activeWorkspaceId=workspaces[0].id;data=JSON.parse(localStorage.getItem('ispusula_ws_'+activeWorkspaceId)||'null')||clone(seed);save();sessionStorage.setItem('ispusula_login_user',user.id);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();const email=$('#email').value.trim().toLowerCase(),password=$('#password').value;const user=users.find(u=>u.email.toLowerCase()===email&&u.password===password);if(user){enterApp(user)}else toast('E-posta veya şifre hatalı.')});
$('#logoutBtn').onclick=()=>{sessionStorage.removeItem('ispusula_login_user');currentUser=null;$('#app').classList.add('hidden');$('#login').classList.remove('hidden')};$('#exportBtn').onclick=exportData;
const savedUserId=sessionStorage.getItem('ispusula_login_user');if(savedUserId){const u=users.find(x=>x.id===savedUserId);if(u)enterApp(u)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
